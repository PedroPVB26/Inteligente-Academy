spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inteligenteacademy
    username: utfpr
    password: utfpr
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${INTELIGENTE_ACADEMY_MAIL_USERNAME}
    password: ${INTELIGENTE_ACADEMY_MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
        debug: true

jwt:
  secret: ${INTELIGENTE_ACADEMY_JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

app:
  base-url: http://localhost:8081
  internal-token: ${INTELIGENTE_ACADEMY_INTERNAL_TOKEN}

server:
  port: 8081

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.transaction: TRACE
    org.springframework.orm.jpa: DEBUG
    org.springframework.web: DEBUG